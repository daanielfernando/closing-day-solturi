<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closing Day Setembro · Solturi · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter+Tight:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --noite:#080F1C; --painel:#0E1829; --borda:#1C2B44; --apagada:#152238; --apagada2:#1B2B45;
  --texto:#EAF0F9; --mute:#8195AE;
  --laranja:#FF6A13; --ambar:#FFC72C; --lima:#B4D62E; --verde:#17C964;
  --u:calc(100vh / 100);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(70vw 60vh at 10% -10%, rgba(255,106,19,.17), transparent 60%),
    radial-gradient(60vw 55vh at 95% 5%, rgba(23,201,100,.12), transparent 58%),
    var(--noite);
  color:var(--texto); font-family:"Inter Tight",system-ui,sans-serif;
  display:flex; flex-direction:column; padding:calc(var(--u)*2.4) calc(var(--u)*3);
  gap:calc(var(--u)*1.8);
}
.rotulo{font-family:"IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mute);font-size:calc(var(--u)*1.4)}
.bloco{background:var(--painel);border:1px solid var(--borda);border-radius:calc(var(--u)*1.5);
  padding:calc(var(--u)*2)}

/* cabecalho */
.topo{display:flex;justify-content:space-between;align-items:flex-end;gap:calc(var(--u)*3)}
.marca{display:flex;align-items:center;gap:calc(var(--u)*1.3);font-family:"IBM Plex Mono",monospace;
  font-size:calc(var(--u)*1.75);letter-spacing:.2em;text-transform:uppercase;color:var(--laranja)}
.pisca{width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border-radius:50%;background:var(--laranja);
  animation:pulso 2.1s infinite}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.25}}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:calc(var(--u)*5);
  line-height:.95;letter-spacing:-.03em;margin-top:calc(var(--u)*.7)}
h1 em{font-style:normal;color:var(--mute)}
.metatopo{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:calc(var(--u)*1.55);
  color:var(--mute);line-height:1.85}
.metatopo b{color:var(--texto);font-weight:500}

/* placa + trava lado a lado */
.topo-grid{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:calc(var(--u)*1.8);
  align-items:stretch}
.placa-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--u)*3);
  margin-bottom:calc(var(--u)*1.4)}
.pct{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:calc(var(--u)*7.4);
  line-height:.85;letter-spacing:-.045em}
.pct span{font-size:.34em;color:var(--mute);margin-left:.1em}
.falta{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:calc(var(--u)*3);
  white-space:nowrap;margin-top:calc(var(--u)*.4)}
.dir{text-align:right}
.grade{display:grid;grid-template-columns:repeat(25,1fr);gap:calc(var(--u)*.32)}
.celula{aspect-ratio:1;border-radius:calc(var(--u)*.28);background:var(--apagada);position:relative;
  overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.celula.zona2{background:var(--apagada2)}
.celula.marco{box-shadow:inset 0 0 0 calc(var(--u)*.18) var(--ambar)}
.celula .luz{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.celula.acesa .luz{opacity:1}
.kpis{display:flex;gap:calc(var(--u)*3);margin-top:calc(var(--u)*1.3);padding-top:calc(var(--u)*1.1);
  border-top:1px solid var(--borda)}
.kpis .num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:calc(var(--u)*2.3);
  margin-top:calc(var(--u)*.4);white-space:nowrap}

.travacard{background:var(--painel);border:1px solid var(--borda);border-radius:calc(var(--u)*1.5);
  padding:calc(var(--u)*2);display:flex;flex-direction:column;
  background-image:linear-gradient(160deg,rgba(255,106,19,.11),transparent 62%)}
.travacard.solto{border-color:rgba(23,201,100,.45);
  background-image:linear-gradient(160deg,rgba(23,201,100,.15),transparent 62%)}
.estado{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:calc(var(--u)*4.2);
  line-height:1;letter-spacing:-.02em;margin-top:calc(var(--u)*.7);color:var(--laranja)}
.travacard.solto .estado{color:var(--verde)}
.estado-sub{color:var(--mute);font-size:calc(var(--u)*1.55);margin-top:calc(var(--u)*.9);line-height:1.5}
.lista-premios{margin-top:auto;padding-top:calc(var(--u)*1.4);border-top:1px solid var(--borda);
  display:flex;flex-direction:column;gap:calc(var(--u)*.8)}
.lp{display:flex;align-items:baseline;justify-content:space-between;gap:calc(var(--u)*1.2);
  font-family:"IBM Plex Mono",monospace;font-size:calc(var(--u)*1.45);color:var(--mute)}
.lp b{color:var(--texto);font-weight:600;font-size:calc(var(--u)*1.95)}
.travacard.solto .lp b{color:var(--ambar)}

/* ponteiros */
.ponteiros{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*1.6);min-height:0}
.pnt{background:var(--painel);border:1px solid var(--borda);border-radius:calc(var(--u)*1.4);
  padding:calc(var(--u)*1.2) calc(var(--u)*1.1) calc(var(--u)*1.3);
  display:flex;flex-direction:column;justify-content:center;min-height:0}
.pnt.top1{border-color:rgba(255,199,44,.5)}
.pnt.bateu{border-color:rgba(23,201,100,.55);background:linear-gradient(180deg,rgba(23,201,100,.08),var(--painel) 60%)}
.pnt svg{width:100%;height:auto;display:block;margin:0 auto}
.pnt .linhas{margin-top:calc(var(--u)*1.1);padding-top:calc(var(--u)*1.1);border-top:1px solid var(--borda);
  display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
.pnt .lnh{display:flex;align-items:baseline;justify-content:space-between;gap:calc(var(--u)*.8)}
.pnt .lnh span{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--u)*1.2);letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute)}
.pnt .lnh b{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--u)*1.7);font-weight:600;white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <div class="topo">
    <div>
      <div class="marca"><span class="pisca"></span><span id="periodo">Closing day</span> · setembro</div>
      <h1>Acender a placa<br><em id="chamada">vale prêmio pro time</em></h1>
    </div>
    <div class="metatopo">
      <b>R$ 2,5 mi</b> libera · <b>R$ 4 mi</b> dobra<br>
      <span id="carimbo">—</span>
    </div>
  </div>

  <div class="topo-grid">
    <div class="bloco">
      <div class="placa-topo">
        <div>
          <div class="rotulo">A placa coletiva · R$ 40 mil por célula</div>
          <div class="pct" id="pct">0<span>%</span></div>
        </div>
        <div class="dir">
          <div class="rotulo" id="rotulo-falta">Falta para liberar</div>
          <div class="falta" id="falta">—</div>
        </div>
      </div>
      <div class="grade" id="grade"></div>
      <div class="kpis">
        <div><div class="rotulo">Vendido</div><div class="num" id="realizado">—</div></div>
        <div><div class="rotulo">Clientes</div><div class="num" id="clientes">—</div></div>
        <div><div class="rotulo">Dias restantes</div><div class="num" id="dias">—</div></div>
        <div><div class="rotulo">Ritmo/dia</div><div class="num" id="ritmo">—</div></div>
      </div>
    </div>

    <aside class="travacard" id="travacard">
      <div class="rotulo">Prêmios</div>
      <div class="estado" id="estado">—</div>
      <div class="estado-sub" id="estado-sub">—</div>
      <div class="lista-premios" id="premios"></div>
    </aside>
  </div>

  <div class="ponteiros" id="ponteiros"></div>

<script>
const D = {"metaPremio": 2500000.0, "metaDobra": 4000000.0, "total": 1106657.65, "pct": 27.67, "pctPremio": 44.27, "liberou": false, "dobrou": false, "alvoAtual": 2500000.0, "falta": 1393342.35, "celulaMarco": 62.5, "clientes": 60, "vendas": 60, "diasRestantes": 6, "ritmoNecessario": 232223.73, "periodo": "23/09 a 30/09", "atualizado": "25/09/2026 às 18:52", "premios": [10000.0, 3000.0, 1500.0], "times": [{"nome": "Furacões", "curto": "Furacões", "meta": 500000.0, "valor": 186592.26, "pct": 37.32, "falta": 313407.74, "clientes": 9, "premio": 10000.0}, {"nome": "Comando Solar", "curto": "Comando", "meta": 1000000.0, "valor": 305888.0, "pct": 30.59, "falta": 694112.0, "clientes": 15, "premio": 3000.0}, {"nome": "Tubarões do Sol", "curto": "Tubarões", "meta": 500000.0, "valor": 150792.45, "pct": 30.16, "falta": 349207.55, "clientes": 8, "premio": 1500.0}, {"nome": "Raios de Fúria", "curto": "Raios", "meta": 500000.0, "valor": 125601.64, "pct": 25.12, "falta": 374398.36, "clientes": 5, "premio": 0.0}, {"nome": "Lobos do Sol", "curto": "Lobos", "meta": 800000.0, "valor": 78163.3, "pct": 9.77, "falta": 721836.7, "clientes": 9, "premio": 0.0}], "fora": [{"nome": "Titãs dos Pampas", "valor": 244120.0}, {"nome": "Legião Germânica", "valor": 14500.0}, {"nome": "SOLTURI", "valor": 1000.0}], "ranking": [{"nome": "Berato Representação", "time": "Comando Solar", "clientes": 9, "valor": 160624.0}, {"nome": "Marcelo Krugel", "time": "Titãs dos Pampas", "clientes": 3, "valor": 132750.0}, {"nome": "Cristhian", "time": "Comando Solar", "clientes": 3, "valor": 96350.0}, {"nome": "Edijane Gomes", "time": "Furacões", "clientes": 2, "valor": 91390.0}, {"nome": "Thiago Parma", "time": "Raios de Fúria", "clientes": 2, "valor": 78372.13}, {"nome": "João Victor Leguiça", "time": "Titãs dos Pampas", "clientes": 3, "valor": 51970.0}, {"nome": "Gabriel Ticaleah", "time": "Tubarões do Sol", "clientes": 2, "valor": 51000.0}, {"nome": "Ricardo Germano Mahlke", "time": "Furacões", "clientes": 3, "valor": 41417.26}, {"nome": "Luis Dalcanale", "time": "Lobos do Sol", "clientes": 2, "valor": 40470.0}, {"nome": "João Carlos Tavares", "time": "Furacões", "clientes": 2, "valor": 37485.0}, {"nome": "ANDRE LUIS NASCIMENTO", "time": "Tubarões do Sol", "clientes": 2, "valor": 35532.45}, {"nome": "Rafael da Cruz", "time": "Tubarões do Sol", "clientes": 2, "valor": 29260.0}, {"nome": "Alexandre Wienen", "time": "Comando Solar", "clientes": 1, "valor": 23890.0}, {"nome": "Diego Vendramin", "time": "Lobos do Sol", "clientes": 2, "valor": 23408.0}, {"nome": "Nelykim Urbanski Barbi", "time": "Tubarões do Sol", "clientes": 1, "valor": 20000.0}, {"nome": "Debora Soster", "time": "Titãs dos Pampas", "clientes": 1, "valor": 17540.0}, {"nome": "Gustavo Tadra", "time": "Raios de Fúria", "clientes": 1, "valor": 17475.02}, {"nome": "Everson Urbim", "time": "Furacões", "clientes": 2, "valor": 16300.0}, {"nome": "Élcio", "time": "Raios de Fúria", "clientes": 1, "valor": 15500.0}, {"nome": "Mario Augusto Freitas", "time": "Tubarões do Sol", "clientes": 1, "valor": 15000.0}, {"nome": "Fabio Henrique Klinkoski", "time": "Legião Germânica", "clientes": 1, "valor": 14500.0}, {"nome": "Gabriel Reina", "time": "Raios de Fúria", "clientes": 1, "valor": 14254.49}, {"nome": "Wesley Martins", "time": "Comando Solar", "clientes": 1, "valor": 13524.0}, {"nome": "Luís Weiss", "time": "Lobos do Sol", "clientes": 2, "valor": 13083.22}, {"nome": "Luciano Maier", "time": "Titãs dos Pampas", "clientes": 1, "valor": 11500.0}, {"nome": "Thomas Vyctor", "time": "Comando Solar", "clientes": 1, "valor": 11500.0}, {"nome": "Francieli Cappa", "time": "Titãs dos Pampas", "clientes": 1, "valor": 10400.0}, {"nome": "Darci Raffael da Silva Gonçalves", "time": "Titãs dos Pampas", "clientes": 1, "valor": 10300.0}, {"nome": "Karina Borges", "time": "Titãs dos Pampas", "clientes": 1, "valor": 9660.0}, {"nome": "Master Sales", "time": "Lobos do Sol", "clientes": 3, "valor": 1202.08}, {"nome": "SOLTURI", "time": "SOLTURI", "clientes": 2, "valor": 1000.0}], "dias": [{"dia": "23/09", "valor": 498136.41}, {"dia": "24/09", "valor": 458231.24}, {"dia": "25/09", "valor": 150290.0}]};
const brl  = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brlF = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const vg   = v => v.toFixed(1).replace('.',',');

const PARADAS=[[255,106,19],[255,199,44],[180,214,46],[23,201,100]];
function cor(t){
  t=Math.min(Math.max(t,0),1);
  const p=t*(PARADAS.length-1), i=Math.min(Math.floor(p),PARADAS.length-2), f=p-i;
  const a=PARADAS[i], b=PARADAS[i+1];
  return `rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(',')})`;
}

/* ponteiro de aceleração: arco de 180° */
const CX=100, CY=112, R=70, A0=180, A1=0;
const ponto=(a,r)=>({x:CX+r*Math.cos(a*Math.PI/180), y:CY-r*Math.sin(a*Math.PI/180)});
function arco(de,ate,r){
  let d='';
  for(let i=0;i<=48;i++){
    const p=ponto(de+(ate-de)*i/48,r);
    d+=(i?'L':'M')+p.x.toFixed(2)+' '+p.y.toFixed(2);
  }
  return d;
}
function ponteiro(t,pos){
  const pct=Math.min(t.pct,100), bateu=t.pct>=100;
  const brilho=(0.30+0.70*pct/100).toFixed(3);
  const c=cor(pct/100), aFim=A0-(A0-A1)*pct/100, ag=ponto(aFim,R*0.78);
  const medalha=['#FFC72C','#C9D3E0','#D98A4A'][pos-1];
  const badge = pos<=3 ? `
    <g opacity="${bateu?1:0.8}">
      <circle cx="${CX}" cy="20" r="15" fill="${bateu?medalha:'none'}" stroke="${medalha}" stroke-width="2"/>
      <text x="${CX}" y="26" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif"
            font-weight="800" font-size="18" fill="${bateu?'#0B1220':medalha}">${pos}</text>
    </g>` : '';
  return `<svg viewBox="0 0 200 182" role="img" aria-label="${t.nome}: ${vg(t.pct)}% da meta">
    ${badge}
    <g opacity="${brilho}">
      <path d="${arco(A0,A1,R)}" fill="none" stroke="#1B2B45" stroke-width="13" stroke-linecap="round"/>
      <path class="arco-valor" d="${arco(A0,A0,R)}" fill="none" stroke="${c}" stroke-width="13"
            stroke-linecap="round" data-fim="${aFim}"/>
      <line class="agulha" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY}" stroke="${c}" stroke-width="4"
            stroke-linecap="round" data-x="${ag.x.toFixed(2)}" data-y="${ag.y.toFixed(2)}"/>
      <circle cx="${CX}" cy="${CY}" r="7" fill="#0E1829" stroke="${c}" stroke-width="3"/>
      <text x="${CX}" y="150" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif"
            font-weight="800" font-size="32" fill="${c}">${vg(t.pct)}%</text>
      <text x="${CX}" y="174" text-anchor="middle" font-family="IBM Plex Mono,monospace"
            font-size="14" letter-spacing="1.5" fill="#8195AE">${t.curto.toUpperCase()}</text>
    </g>
  </svg>`;
}

/* cabecalho e numeros */
document.getElementById('periodo').textContent='Closing day '+D.periodo;
document.getElementById('carimbo').textContent='atualizado '+D.atualizado;
document.getElementById('realizado').textContent=brl(D.total);
document.getElementById('clientes').textContent=D.clientes;
document.getElementById('dias').textContent=D.diasRestantes+(D.diasRestantes===1?' dia':' dias');
document.getElementById('ritmo').textContent=brl(D.ritmoNecessario);
document.getElementById('falta').textContent=D.falta>0?brlF(D.falta):'tudo conquistado';
document.getElementById('pct').style.color=cor(D.pct/100);

/* card dos premios */
const tc=document.getElementById('travacard');
const est=document.getElementById('estado'), esub=document.getElementById('estado-sub');
if(D.dobrou){
  tc.classList.add('solto');
  est.textContent='EM DOBRO';
  esub.textContent='R$ 4 mi batidos. Os três primeiros times levam o prêmio dobrado.';
  document.getElementById('chamada').textContent='prêmio em dobro garantido';
  document.getElementById('rotulo-falta').textContent='Acima de R$ 4 mi';
  document.getElementById('falta').textContent=brlF(D.total-D.metaDobra)+' acima';
  document.getElementById('falta').style.color='var(--verde)';
}else if(D.liberou){
  tc.classList.add('solto');
  est.textContent='LIBERADOS';
  esub.textContent='Faltam '+brlF(D.metaDobra-D.total)+' na placa para dobrar tudo.';
  document.getElementById('rotulo-falta').textContent='Falta para dobrar';
}else{
  est.textContent='TRAVADOS';
  esub.textContent='Faltam '+brlF(D.metaPremio-D.total)+' na placa para destravar os R$ 2,5 mi.';
}
const pr=document.getElementById('premios');
['1º lugar','2º lugar','3º lugar'].forEach((p,i)=>{
  const el=document.createElement('div'); el.className='lp';
  el.innerHTML='<span>'+p+'</span><b>'+brl(D.premios[i])+'</b>'; pr.appendChild(el);
});

/* a placa */
const grade=document.getElementById('grade');
const marco=Math.round(D.celulaMarco), inteiras=Math.floor(D.pct), resto=D.pct-inteiras;
for(let i=0;i<100;i++){
  const c=document.createElement('div');
  c.className='celula'+(i>=marco-1?' zona2':'')+(i===marco-1?' marco':'');
  const l=document.createElement('span'); l.className='luz';
  l.style.background=cor(i/99); l.style.boxShadow=`0 0 calc(var(--u)*1.1) ${cor(i/99)}`;
  c.appendChild(l); grade.appendChild(c);
  setTimeout(()=>{
    if(i<inteiras) c.classList.add('acesa');
    else if(i===inteiras&&resto>0.02){c.classList.add('acesa');l.style.clipPath=`inset(${(1-resto)*100}% 0 0 0)`;}
  },250+i*14);
}
let n=0; const pctEl=document.getElementById('pct');
(function passo(){ n=Math.min(n+D.pct/50,D.pct);
  pctEl.innerHTML=vg(n)+'<span>%</span>';
  if(n<D.pct) requestAnimationFrame(passo); })();

/* os ponteiros */
const pEl=document.getElementById('ponteiros');
D.times.forEach((t,i)=>{
  const el=document.createElement('div');
  el.className='pnt'+(i===0?' top1':'')+(t.pct>=100?' bateu':'');
  el.innerHTML=ponteiro(t,i+1)+
    `<div class="linhas">
       <div class="lnh"><span>Objetivo</span><b>${brl(t.meta)}</b></div>
       <div class="lnh"><span>Realizado</span><b style="color:${cor(Math.min(t.pct,100)/100)}">${brl(t.valor)}</b></div>
     </div>`;
  pEl.appendChild(el);
  const svg=el.querySelector('svg');
  const arcoV=svg.querySelector('.arco-valor'), ag=svg.querySelector('.agulha');
  ag.style.transition='x2 .9s cubic-bezier(.2,.8,.3,1), y2 .9s cubic-bezier(.2,.8,.3,1)';
  setTimeout(()=>{
    arcoV.setAttribute('d',arco(A0,+arcoV.dataset.fim,R));
    ag.setAttribute('x2',ag.dataset.x); ag.setAttribute('y2',ag.dataset.y);
  },300+i*120);
});

setTimeout(()=>location.reload(true),5*60*1000);
</script>
</body>
</html>
